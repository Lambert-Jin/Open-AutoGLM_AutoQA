name: 今日头条评论区测试
device:
  type: android
config:
  action_model:
    provider: autoglm
    base_url: ${AUTOGLM_BASE_URL}
    api_key: ${AUTOGLM_API_KEY}
    model: autoglm-phone
  vlm:
    provider: gemini
    api_key: ${GEMINI_API_KEY}
    model: gemini-3-pro-image-preview
tasks:
- name: 今日头条激励任务完成及状态检查
  flow:
  - action: 打开今日头条App
    cache_key: launch:toutiao
    timeout: 15
  - action: 点击底部导航栏的'我的'
    cache_key: tap:me_tab
  - action: 点击'创作中心'
    cache_key: tap:creator_center
  - action: 找到"带图或话题发文"，点击'去完成'按钮
    cache_key: tap:go_to_complete_button
  - action: 按照任务要求完成任务并发布
    cache_key: tap:complete_task
  - action: 下滑找到刚刚完成的任务
    cache_key: scoll:task
  - assert: 检查刚刚完成的任务右边按钮显示为'审核中'