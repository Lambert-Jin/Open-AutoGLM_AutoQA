name: 今日头条激励任务测试（Qwen）
device:
  type: adb
config:
  action_model:
    provider: autoglm
    base_url: ${AUTOGLM_BASE_URL}
    api_key: ${AUTOGLM_API_KEY}
    model: autoglm-phone
  vlm:
    provider: gemini
    api_key: ${GEMINI_API_KEY}
    model: gemini-3-pro-image-preview
  llm:
    provider: gemini
    api_key: ${GEMINI_API_KEY}
    model: gemini-3-pro-image-preview
tasks:
- name: 今日头条激励任务完成及状态检查
  flow:
  - action: 打开今日头条App
    timeout: 15
  - action: 点击底部导航栏的'我的'
  - action: 点击'创作中心'
  - action: 找到"带图或话题发文"任务，点击'去完成'按钮
  - action: 按照任务要求完成任务并发布
  - action: 下滑找到刚刚完成的任务
  - assert: 检查刚刚完成的任务右边按钮显示为'审核中'
